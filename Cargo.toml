[package]
name = "typetype"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
crossterm = { version = "0.29", default-features = false, features = [
  "event-stream"
] }
futures = "0.3.31"
rand = "0.9.1"
ratatui = "0.29.0"
serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
tokio = {version = "1.*", features = ["full"]}
tokio-stream = "0.1.14"
async-deferred = "0.2"
log = "*"

[target.'cfg(debug_assertions)'.dependencies]
simple-logging="2.*"


